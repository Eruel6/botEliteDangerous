<!-- painel.html -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cliente Elite Dangerous</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px; background: #14100c; color: #e8dcc8;
         font: 14px/1.5 ui-monospace, Consolas, monospace; }
  h1 { font-size: 18px; margin: 0 0 20px; color: #ff8c1a; }
  .cartoes { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
  .cartao { background: #1e1813; border: 1px solid #3a2f24; border-radius: 6px;
            padding: 12px 16px; min-width: 180px; }
  .rotulo { font-size: 11px; text-transform: uppercase; color: #9a8b76; }
  .valor { font-size: 16px; margin-top: 4px; }
  .ok { color: #6ac46a; } .ruim { color: #e05c5c; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 24px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #2b2219; }
  th { color: #9a8b76; font-weight: normal; font-size: 11px; text-transform: uppercase; }
  .erro { color: #e05c5c; }
  .vazio { color: #6b5d4c; font-style: italic; }
  .abas { display: flex; gap: 8px; margin-bottom: 20px; }
  .aba { background: #1e1813; color: #9a8b76; border: 1px solid #3a2f24; border-radius: 6px;
         padding: 6px 14px; font: inherit; cursor: pointer; }
  .aba.ativa { color: #ff8c1a; border-color: #ff8c1a; }
  .bloco-titulo { font-size: 13px; color: #9a8b76; text-transform: uppercase; margin: 20px 0 6px; }
  .cartao.clicavel { cursor: pointer; text-align: left; font: inherit; color: inherit;
                     transition: transform .15s, border-color .15s, box-shadow .15s; }
  .cartao.clicavel:hover, .cartao.clicavel:focus-visible {
    transform: translateY(-2px); border-color: #ff8c1a; box-shadow: 0 4px 16px rgba(255,140,26,.15); }
  .cartao .linha { margin-top: 2px; }
  tbody tr:hover { background: #241c15; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  dialog { background: #1e1813; color: #e8dcc8; border: 1px solid #3a2f24; border-radius: 6px;
           padding: 16px 20px; max-width: min(900px, 92vw); max-height: 80vh; overflow: auto; }
  dialog[open] { animation: entrada .15s ease-out; }
  dialog::backdrop { background: rgba(0,0,0,.6); backdrop-filter: blur(3px); }
  .modal-cab { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .modal-cab h2 { margin: 0; font-size: 15px; color: #ff8c1a; }
  #modal-fechar { background: none; border: 1px solid #3a2f24; border-radius: 6px; color: #9a8b76;
                  font: inherit; font-size: 18px; line-height: 1; padding: 2px 10px; cursor: pointer; }
  #modal-fechar:hover { color: #ff8c1a; border-color: #ff8c1a; }
  #modal-corpo { overflow: auto; }
  @keyframes entrada { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<h1>Cliente Elite Dangerous</h1>

<div class="abas">
  <button class="aba ativa" id="botao-colonizacao" onclick="mostrarAba('colonizacao')">Colonização</button>
  <button class="aba" id="botao-exploracao" onclick="mostrarAba('exploracao')">Exploração</button>
</div>

<div id="aba-colonizacao">
<div class="cartoes">
  <div class="cartao"><div class="rotulo">Conexão</div><div class="valor" id="conexao">—</div></div>
  <div class="cartao"><div class="rotulo">Último envio aceito</div><div class="valor" id="envio">—</div></div>
  <div class="cartao"><div class="rotulo">Última leitura</div><div class="valor" id="leitura">—</div></div>
</div>

<div class="cartao" style="margin-bottom:24px">
  <div class="rotulo">Journal em uso</div><div class="valor" id="journal">—</div>
</div>

<h2 style="font-size:13px;color:#9a8b76;text-transform:uppercase">Instalações detectadas</h2>
<table><thead><tr><th>Instalação</th><th>Progresso</th><th>Materiais faltando</th><th>Unidades</th></tr></thead>
<tbody id="instalacoes"></tbody></table>

<h2 style="font-size:13px;color:#9a8b76;text-transform:uppercase">Onde comprar</h2>
<div id="compras"></div>

<h2 style="font-size:13px;color:#9a8b76;text-transform:uppercase">Erros recentes</h2>
<table><thead><tr><th>Quando</th><th>O quê</th></tr></thead><tbody id="erros"></tbody></table>
</div>

<div id="aba-exploracao" style="display:none">
  <div id="exploracao-cartoes" class="cartoes"><p class="vazio">lendo os journals…</p></div>
  <div id="exploracao-precos"></div>
</div>

<dialog id="modal-exploracao" onclick="if (event.target === this) fecharModal()" onclose="modalAberto = null">
  <div class="modal-cab"><h2 id="modal-titulo"></h2>
    <button id="modal-fechar" aria-label="Fechar" onclick="fecharModal()">×</button></div>
  <div id="modal-corpo"></div>
</dialog>

<script>
const hora = (iso) => iso ? new Date(iso).toLocaleTimeString("pt-BR") : "nunca";
// Só hora e minuto: o painel diz "dados de 14:32", não "dados de 14:32:07".
const horaCurta = (iso) => iso
  ? new Date(iso).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
  : null;

// Tudo entra como texto, nunca como HTML. A mensagem de erro carrega o corpo
// da resposta do servidor, e o edge do Render devolve uma página inteira quando
// está acordando o serviço hibernado — isso não pode virar markup aqui dentro.
function preencher(tbody, vazio, colunas, linhas) {
  tbody.replaceChildren();
  if (!linhas.length) {
    const td = tbody.insertRow().insertCell();
    td.colSpan = colunas;
    td.className = "vazio";
    td.textContent = vazio;
    return;
  }
  for (const celulas of linhas) {
    const tr = tbody.insertRow();
    for (const [texto, classe] of celulas) {
      const td = tr.insertCell();
      td.textContent = texto;
      if (classe) td.className = classe;
    }
  }
}

function pintar(d) {
  const status = d.ultimo_status_http;
  const conexao = document.getElementById("conexao");
  if (status === null)      { conexao.textContent = "sem envio ainda"; conexao.className = "valor"; }
  else if (status >= 200 && status < 300) { conexao.textContent = "ok (" + status + ")"; conexao.className = "valor ok"; }
  else                      { conexao.textContent = "erro " + status;  conexao.className = "valor ruim"; }

  document.getElementById("envio").textContent   = hora(d.ultimo_envio_ok);
  document.getElementById("leitura").textContent = hora(d.ultima_leitura);
  document.getElementById("journal").textContent = d.journal_atual || "nenhum encontrado";

  preencher(document.getElementById("instalacoes"), "nenhuma obra no Journal atual", 4,
    d.instalacoes.map(i => [[i.nome], [i.porcentagem + "%"], [i.materiais_faltando], [i.total_faltando]]));

  preencher(document.getElementById("erros"), "nenhum erro", 2,
    d.erros.map(e => [[hora(e.quando)], [e.mensagem, "erro"]]));

  const compras = document.getElementById("compras");
  compras.replaceChildren();
  if (!d.compras || !d.compras.length) {
    const vazio = document.createElement("p");
    vazio.className = "vazio";
    vazio.textContent = "nada faltando, ou nenhum sistema conhecido ainda";
    compras.appendChild(vazio);
  }
  for (const s of d.compras || []) {
    const bloco = document.createElement("div");
    bloco.style.marginBottom = "12px";

    const titulo = document.createElement("div");
    titulo.textContent = `${s.material} — falta ${s.faltando}`;
    if (s.desatualizado) {
      const quando = horaCurta(s.quando);
      titulo.textContent += quando ? ` (dados de ${quando})` : " (dados antigos)";
    }
    bloco.appendChild(titulo);

    if (!s.consultavel) {
      const nota = document.createElement("div");
      nota.className = "vazio";
      nota.textContent = "sem dados de compra até alguém reportar esta obra de novo";
      bloco.appendChild(nota);
    } else if (!s.estacoes.length) {
      const nota = document.createElement("div");
      nota.className = "vazio";
      // Sem estações e desatualizado não é "não há nada": é "não consegui
      // perguntar". Dizer "nada dentro de 50 ly" aqui seria mentira.
      nota.textContent = s.desatualizado
        ? "não consegui consultar agora"
        : "nada dentro de 50 ly";
      bloco.appendChild(nota);
    }

    for (const e of s.estacoes) {
      const linha = document.createElement("div");
      linha.style.paddingLeft = "16px";
      linha.textContent =
        `${e.carrier ? "🛸 " : ""}${e.nome} · ${e.sistema} · ` +
        `${e.distancia_ly} ly · ${Math.round(e.distancia_ls)} Ls · ` +
        `${e.estoque} t · ${e.preco} cr`;
      bloco.appendChild(linha);
    }
    compras.appendChild(bloco);
  }
}

function mostrarAba(nome) {
  for (const aba of ["colonizacao", "exploracao"]) {
    document.getElementById("aba-" + aba).style.display = aba === nome ? "" : "none";
    document.getElementById("botao-" + aba).className = aba === nome ? "aba ativa" : "aba";
  }
}

// Créditos em milhões com uma casa e vírgula decimal: 5000000 -> "5,0 mi".
function mi(n) {
  return n === null || n === undefined ? "—" : (n / 1e6).toFixed(1).replace(".", ",") + " mi";
}
const ROTULO_BONUS = { provavel: "provável", desconhecido: "desconhecido", improvavel: "improvável" };

function elemento(tag, texto, classe) {
  const el = document.createElement(tag);
  if (texto !== undefined) el.textContent = texto;
  if (classe) el.className = classe;
  return el;
}

function tabelaTexto(cabecalho, linhas, numericas = []) {
  const t = elemento("table");
  const cab = elemento("tr");
  cabecalho.forEach((c, i) => cab.appendChild(elemento("th", c, numericas.includes(i) ? "num" : undefined)));
  const thead = elemento("thead");
  thead.appendChild(cab);
  t.appendChild(thead);
  const corpo = elemento("tbody");
  for (const linha of linhas) {
    const tr = elemento("tr");
    linha.forEach((c, i) => tr.appendChild(elemento("td", c, numericas.includes(i) ? "num" : undefined)));
    corpo.appendChild(tr);
  }
  t.appendChild(corpo);
  return t;
}

// As listas de vendidas e de primeiros vêm cortadas nas mais recentes.
function cortada(mostrados, total) {
  return total > mostrados ? `mostrando ${mostrados} de ${total}` : null;
}

let dadosExploracao = null;
let modalAberto = null;   // chave do card aberto, ou null

const TITULO_MODAL = { a_bordo: "A bordo (perde-se se morrer)", vendido: "Vendido", primeiros: "Primeiro a..." };

function corpoModal(resumo, tabela, nota) {
  const b = elemento("div");
  b.appendChild(elemento("div", resumo));
  if (tabela) b.appendChild(tabela);
  if (nota) b.appendChild(elemento("div", nota, "vazio"));
  return b;
}

function conteudoModal(chave, d) {
  const marca = (v) => v ? "✓" : "";
  if (chave === "a_bordo") {
    const ab = d.a_bordo;
    return corpoModal(
      `Amostras: ${ab.amostras.length}   Base: ${mi(ab.total_base)}   Com bônus provável: ${mi(ab.total_com_bonus)}`,
      ab.amostras.length ? tabelaTexto(["Espécie", "Planeta", "Base", "Bônus"],
        ab.amostras.map(a => [
          a.variante && !a.variante.includes(a.especie) ? `${a.especie} · ${a.variante}` : (a.variante || a.especie),
          a.corpo, mi(a.preco_base), ROTULO_BONUS[a.bonus] || a.bonus]), [2]) : null,
      `Dados de exploração: ${ab.sistemas_exploracao} sistemas, ${ab.corpos_exploracao} corpos`);
  }
  if (chave === "vendido") {
    const v = d.vendido;
    const qtdVendidas = v.quantidade ?? v.amostras.length;
    return corpoModal(
      `Amostras: ${qtdVendidas}   Total: ${mi(v.total)}   Exploração: ${mi(v.exploracao_total)}`,
      v.amostras.length ? tabelaTexto(["Espécie", "Planeta", "Valor", "Previsão"],
        v.amostras.map(a => [
          a.especie, a.corpo, mi(a.valor),
          a.acertou === null || a.acertou === undefined ? "" :
            (a.acertou ? "previsão certa" : "previsão errada")]), [2]) : null,
      [cortada(v.amostras.length, qtdVendidas),
       d.perdido && d.perdido.amostras
         ? `Perdido ao morrer: ${d.perdido.amostras} amostras, ${d.perdido.sistemas} sistemas` : null]
        .filter(Boolean).join(" · ") || null);
  }
  const p = d.primeiros;
  return corpoModal(
    `Descobrir sistema: ${p.sistemas_descobertos}   Descobrir corpo: ${p.corpos_descobertos}   Mapear: ${p.mapeados}   Pisar: ${p.pisados}`,
    p.corpos.length ? tabelaTexto(["Corpo", "Descobriu", "Mapeou", "Pisou"],
      p.corpos.map(c => [c.corpo, marca(c.descobriu), marca(c.mapeou), marca(c.pisou)])) : null,
    cortada(p.corpos.length, p.total_corpos ?? p.corpos.length));
}

function preencherModal(chave) {
  if (!dadosExploracao) return;
  const corpo = document.getElementById("modal-corpo");
  const rolagem = corpo.scrollTop;
  document.getElementById("modal-titulo").textContent = TITULO_MODAL[chave];
  corpo.replaceChildren(conteudoModal(chave, dadosExploracao));
  corpo.scrollTop = rolagem;
}

function abrirModal(chave) {
  if (!dadosExploracao) return;
  const dialogo = document.getElementById("modal-exploracao");
  const jaAberto = modalAberto === chave && dialogo.open;
  modalAberto = chave;
  if (!jaAberto) document.getElementById("modal-corpo").scrollTop = 0;
  preencherModal(chave);
  if (!dialogo.open) dialogo.showModal();
}

function fecharModal() {
  modalAberto = null;
  const dialogo = document.getElementById("modal-exploracao");
  if (dialogo.open) dialogo.close();
}

function cartao(rotulo, linhas, chave) {
  const c = elemento(chave ? "button" : "div", undefined, chave ? "cartao clicavel" : "cartao");
  c.appendChild(elemento("div", rotulo, "rotulo"));
  for (const l of linhas) c.appendChild(elemento("div", l, "linha"));
  if (chave) c.addEventListener("click", () => abrirModal(chave));
  return c;
}

function falhaExploracao() {
  document.getElementById("exploracao-cartoes").replaceChildren(
    elemento("p", "não consegui ler a exploração", "vazio"));
}

function pintarPrecos(d) {}   // a tabela de preços entra na próxima etapa

function pintarExploracao(d) {
  const raiz = document.getElementById("exploracao-cartoes");
  if (d.carregando) {
    raiz.replaceChildren(elemento("p", "lendo os journals…", "vazio"));
    return;
  }
  const ab = d.a_bordo, v = d.vendido, m = d.medias, p = d.primeiros;
  dadosExploracao = d;
  const obs = v.multiplicador_observado;
  const rotuloBonus = obs !== null && obs !== undefined && obs !== d.multiplicador
    ? `com bônus (×${d.multiplicador}, observado ×${obs.toFixed(1).replace(".", ",")})`
    : `com bônus (×${d.multiplicador}, estimado)`;

  const cartoes = [
    cartao("A bordo", [
      `${ab.amostras.length} amostras · base ${mi(ab.total_base)}`,
      `prováveis (${ab.provaveis_quantidade}): ${mi(ab.provaveis_base)} → ${mi(ab.provaveis_com_bonus)}`,
      rotuloBonus], "a_bordo"),
    cartao("Vendido", [
      `${v.quantidade ?? v.amostras.length} amostras · ${mi(v.total)}`,
      `exploração: ${mi(v.exploracao_total)}`,
      ...(obs !== null && obs !== undefined ? [`bônus observado ×${obs.toFixed(1).replace(".", ",")}`] : [])],
      "vendido"),
  ];
  if (d.carreira) {
    const c = d.carreira;
    cartoes.push(cartao("Carreira (jogo)", [
      `${c.Organic_Data || 0} amostras · ${mi(c.Organic_Data_Profits || 0)}`,
      `${c.First_Logged || 0} primeiras descobertas`]));
  }
  cartoes.push(
    cartao("Primeiro a…", [
      `sistemas ${p.sistemas_descobertos} · corpos ${p.corpos_descobertos}`,
      `mapeou ${p.mapeados} · pisou ${p.pisados}`], "primeiros"),
    cartao("Médias", [
      `por amostra ${mi(m.por_amostra)}`, `por planeta ${mi(m.por_planeta)}`,
      `por sessão ${mi(m.por_sessao)}`]));
  raiz.replaceChildren(...cartoes);

  if (modalAberto !== null) preencherModal(modalAberto);
  pintarPrecos(d);
}

async function atualizar() {
  try { pintar(await (await fetch("/estado.json")).json()); }
  catch (e) { document.getElementById("conexao").textContent = "painel sem resposta"; }
  try { pintarExploracao(await (await fetch("/exploracao.json")).json()); }
  catch (e) { falhaExploracao(); }   // fica só na aba de exploração; a colonização segue
}
atualizar();
setInterval(atualizar, 5000);
</script>
</body>
</html>
